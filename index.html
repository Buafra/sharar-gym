<title>Sharar Gym · جيم شرار</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --surface2:#EFEDE6; --track:#ECEAE2;
  --text:#1E1E1B; --sec:#6E6D66; --border:rgba(0,0,0,.09); --border2:rgba(0,0,0,.16);
  --acc:#534AB7; --acc-soft:#EEEDFE;
  --ok-border:#5DCAA5; --ok-text:#0F6E56;
  --toast-bg:#2A2A2E; --toast-fg:#F5F4EF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]){
    --bg:#1B1B1E; --surface:#26262A; --surface2:#303036; --track:#37373D;
    --text:#F0EFEA; --sec:#A5A49C; --border:rgba(255,255,255,.1); --border2:rgba(255,255,255,.2);
    --acc:#AFA9EC; --acc-soft:#3C3489;
    --ok-border:#0F6E56; --ok-text:#9FE1CB;
    --toast-bg:#EFEDE6; --toast-fg:#1E1E1B;
  }
}
:root[data-mode="dark"]{
  --bg:#1B1B1E; --surface:#26262A; --surface2:#303036; --track:#37373D;
  --text:#F0EFEA; --sec:#A5A49C; --border:rgba(255,255,255,.1); --border2:rgba(255,255,255,.2);
  --acc:#AFA9EC; --acc-soft:#3C3489;
  --ok-border:#0F6E56; --ok-text:#9FE1CB;
  --toast-bg:#EFEDE6; --toast-fg:#1E1E1B;
}
.g-big{--c-bg:#EEEDFE;--c-fg:#3C3489;--c-bar:#7F77DD}
.g-small{--c-bg:#E1F5EE;--c-fg:#085041;--c-bar:#1D9E75}
.g-extra{--c-bg:#FAECE7;--c-fg:#712B13;--c-bar:#D85A30}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]) .g-big{--c-bg:#3C3489;--c-fg:#CECBF6}
  :root:not([data-mode="light"]) .g-small{--c-bg:#085041;--c-fg:#9FE1CB}
  :root:not([data-mode="light"]) .g-extra{--c-bg:#712B13;--c-fg:#F5C4B3}
}
[data-mode="dark"] .g-big{--c-bg:#3C3489;--c-fg:#CECBF6}
[data-mode="dark"] .g-small{--c-bg:#085041;--c-fg:#9FE1CB}
[data-mode="dark"] .g-extra{--c-bg:#712B13;--c-fg:#F5C4B3}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header.app{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
header.app .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:12px}
h1{font-size:19px;font-weight:600}
.date{font-size:12.5px;color:var(--sec);margin-top:1px}
#langBtn,#themeBtn{border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
#themeBtn{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center}
#themeBtn svg{width:19px;height:19px}
.hbtns{display:flex;align-items:center;gap:8px}
.sec-head{font-size:12.5px;color:var(--sec);margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .09s ease,border-color .15s;user-select:none}
.card:active{transform:scale(.965)}
.card.done{border-color:var(--ok-border)}
.row{display:flex;gap:10px;align-items:center}
.av,.mpic{flex:none;display:flex;align-items:center;justify-content:center;background:var(--avbg);--avbg:#F4F4F0;--body:#B7BBBF;--shade:#A2A8AD;--hl:#3FA84F}
.av{width:60px;height:60px;border-radius:50%}
.mpic{width:52px;height:52px;border-radius:13px}
.av svg{width:44px;height:44px}
.mpic svg{width:42px;height:42px}
.av svg .b,.mpic svg .b{fill:var(--body)}
.av svg .s,.mpic svg .s{fill:var(--shade)}
.av svg .d,.mpic svg .d{fill:#6B7076}
.av svg .h{fill:var(--hl)}
.mpic svg .fr{stroke:var(--body);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.mpic svg .fs{stroke:var(--shade);fill:none;stroke-width:2.4;stroke-linecap:round}
.mpic svg .fd{stroke:#6B7076;fill:none;stroke-width:4;stroke-linecap:round}
@media (prefers-color-scheme: dark){:root:not([data-mode="light"]) .av,:root:not([data-mode="light"]) .mpic{--avbg:#33343A;--body:#7A8086;--shade:#666C72}}
[data-mode="dark"] .av,[data-mode="dark"] .mpic{--avbg:#33343A;--body:#7A8086;--shade:#666C72}
.nm{font-size:14.5px;font-weight:600}
.sub{font-size:11.5px;color:var(--sec)}
.cnt{font-size:12.5px;color:var(--sec);margin-top:1px}
.cnt.ok{color:var(--ok-text)}
.cnt .td{color:var(--c-fg);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--track);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c-bar);transition:width .25s ease}
.dots{display:flex;gap:6px;margin-top:12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--track);border:1px solid var(--border2)}
.dot.on{background:var(--c-bar);border-color:var(--c-bar)}
.minus{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:18px}
.panel h2{font-size:14.5px;font-weight:600;margin-bottom:8px}
.sumline{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-top:1px solid var(--border)}
.sumline:first-of-type{border-top:none}
.sumline .v{color:var(--sec)}
.muted{color:var(--sec);font-size:13px}
.total{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;border-top:1px solid var(--border2);padding-top:9px;margin-top:2px}
.wkstat{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wdots{display:flex;gap:6px}
.wdot{width:11px;height:11px;border-radius:50%;background:var(--track);border:1px solid var(--border2)}
.wdot.on{background:var(--acc);border-color:var(--acc)}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.wrow:first-of-type{border-top:none}
.wrow .av{width:42px;height:42px}
.wrow .av svg{width:31px;height:31px}
.exm summary{gap:10px}
.exm .av{width:44px;height:44px}
.exm .av svg{width:32px;height:32px}
.exnm{flex:1;text-align:start}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);font-size:13.5px;cursor:pointer;user-select:none}
.exrow:active{background:var(--surface2)}
.exsub{font-size:11.5px;color:var(--sec);margin-top:1px}
.chip{font-size:11px;padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--sec);flex:none}
.exadd{padding:11px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--acc);cursor:pointer}
.exform{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.exform input,.exform select{padding:8px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.exform input{flex:1 1 100%;min-width:0}
.exform select{flex:1}
.exform button{padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.wrow .info{flex:1;min-width:0}
.wrow .nm{font-size:13.5px}
.wrow .bar{margin-top:5px}
.wrow .cnt{flex:none;margin:0}
details.month{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-top:12px;overflow:hidden}
details.month summary{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-size:14.5px;font-weight:600;cursor:pointer;list-style:none}
details.month summary::-webkit-details-marker{display:none}
details.month summary .n{color:var(--sec);font-size:12.5px;font-weight:400}
.dayrow{padding:10px 14px;border-top:1px solid var(--border)}
.dayrow .d{font-size:13.5px;font-weight:600}
.dayrow .s{font-size:12.5px;color:var(--sec);margin-top:1px}
.btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;cursor:pointer}
.btns button:active{transform:scale(.98)}
nav{position:fixed;bottom:0;inset-inline:0;z-index:10;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:none;background:none;color:var(--sec);font:inherit;font-size:11.5px;cursor:pointer}
nav button.active{color:var(--acc)}
nav svg{width:22px;height:22px}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:max-content;max-width:85%;background:var(--toast-bg);color:var(--toast-fg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}
#rest{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));inset-inline-end:16px;display:flex;align-items:center;gap:7px;background:var(--toast-bg);color:var(--toast-fg);padding:8px 13px;border-radius:99px;font-size:13.5px;font-variant-numeric:tabular-nums;z-index:19;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#rest[hidden]{display:none}
#rest button{background:none;border:none;color:inherit;font-size:17px;line-height:1;cursor:pointer;padding:0 1px}
@keyframes pop{50%{transform:scale(1.3)}}
.cnt.pop{animation:pop .3s ease;display:inline-block}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dtot{font-size:12px;color:var(--sec);flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="app"><div class="wrap">
  <div><h1 id="hTitle">جيم شرار</h1><div class="date" id="hDate"></div><div class="date" id="hWeek"></div></div>
  <div class="hbtns"><button id="themeBtn" type="button"></button><button id="langBtn" type="button">EN</button></div>
</div></header>

<main class="wrap" id="view"></main>

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s && s.version === 1 && typeof s.days === 'object' && s.days) {
        if (s.lang !== 'ar' && s.lang !== 'en') s.lang = 'ar';
        if (s.theme !== 'light' && s.theme !== 'dark') s.theme = 'auto';
        if (!s.custom || typeof s.custom !== 'object') s.custom = {};
        return s;
      }
    } catch(e) {
      try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch(_) {}
    }
  }
  return { version:1, lang:'ar', theme:'auto', days:{}, custom:{}, lastExport:null };
}

const state = load();
const ui = { tab:'today', open:null, openExr:new Set(), addingFor:null };

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e) { toast(t('saveFail')); }
}

function t(k){ return I18N[state.lang][k]; }

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 14.6A8.8 8.8 0 0 1 9.4 3.7 8.8 8.8 0 1 0 20.3 14.6z"/></svg>';
function effectiveTheme(){
  if (state.theme === 'light' || state.theme === 'dark') return state.theme;
  try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e) { return 'light'; }
}
function applyTheme(){
  const root = document.documentElement;
  if (state.theme === 'light' || state.theme === 'dark') root.setAttribute('data-mode', state.theme);
  else root.removeAttribute('data-mode');
  const btn = document.getElementById('themeBtn');
  btn.innerHTML = effectiveTheme() === 'dark' ? SUN : MOON;
  btn.setAttribute('aria-label', t('themeLbl'));
}
function loc(){ return state.lang === 'ar' ? 'ar-u-ca-gregory-nu-latn' : 'en'; }
function fmt(d, opts){ return new Intl.DateTimeFormat(loc(), opts).format(d); }

function dateKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseKey(k){
  const [y,m,dd] = k.split('-').map(Number);
  return new Date(y, m-1, dd);
}
function todayKey(){ return dateKey(new Date()); }

function weekKeys(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  start.setDate(start.getDate() - start.getDay());
  return Array.from({length:7}, (_,i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return dateKey(d);
  });
}

function weekTotal(id){
  return weekKeys().reduce((sum,k) => sum + ((state.days[k] || {})[id] || 0), 0);
}
function dayTotalSets(day){
  return MUSCLES.reduce((s,m) => s + (m.session ? 0 : (day[m.id] || 0)), 0);
}
function dayHasWork(day){
  return MUSCLES.some(m => (day[m.id] || 0) > 0);
}
function daysTrainedThisWeek(){
  return weekKeys().filter(k => state.days[k] && dayHasWork(state.days[k])).length;
}
function daySummaryText(day){
  const parts = [];
  for (const m of MUSCLES) {
    const v = day[m.id] || 0;
    if (v > 0) parts.push(t('m')[m.id][0] + (m.session ? ' ✓' : ' ' + v));
  }
  return parts.join(' · ');
}

function logSet(id){
  const m = MUSCLES.find(x => x.id === id);
  const tk = todayKey();
  const day = state.days[tk] = state.days[tk] || {};
  if (m.session && (day[id] || 0) >= 1) { toast(t('alreadyToday')); return; }
  day[id] = (day[id] || 0) + 1;
  save();
  try { navigator.vibrate && navigator.vibrate(12); } catch(e) {}
  render();
  const el = document.querySelector('[data-log="' + id + '"] .cnt');
  if (el) el.classList.add('pop');
  if (weekTotal(id) === m.target) toast(t('m')[id][0] + ' — ' + t('targetHit'));
  if (!m.session) startRest();
}

let restInt = null, restEnd = 0;
function startRest(){
  restEnd = Date.now() + 90000;
  const el = document.getElementById('rest');
  el.hidden = false;
  clearInterval(restInt);
  const tick = () => {
    const s = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    document.getElementById('restT').textContent =
      String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    if (s <= 0) {
      stopRest();
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch(e) {}
      toast(t('restDone'));
    }
  };
  tick();
  restInt = setInterval(tick, 250);
}
function stopRest(){
  clearInterval(restInt);
  restInt = null;
  document.getElementById('rest').hidden = true;
}
function unlogSet(id){
  const tk = todayKey();
  const day = state.days[tk];
  if (!day || !(day[id] > 0)) return;
  day[id] -= 1;
  if (day[id] === 0) delete day[id];
  save();
  render();
}

function muscleCard(m){
  const L = t('m')[m.id];
  const wk = weekTotal(m.id);
  const td = (state.days[todayKey()] || {})[m.id] || 0;
  const done = wk >= m.target;
  let progress;
  if (m.session) {
    const n = Math.max(m.target, wk);
    progress = '<div class="dots">' + Array.from({length:n}, (_,i) =>
      '<span class="dot' + (i < wk ? ' on' : '') + '"></span>').join('') + '</div>';
  } else {
    const pct = Math.min(100, Math.round(wk / m.target * 100));
    progress = '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  }
  const cnt = wk + '/' + m.target + (m.session ? '' : ' ' + t('sets')) +
    (td > 0 ? ' · <span class="td">+' + td + ' ' + t('todayWord') + '</span>' : '');
  return '<div class="card g-' + m.grp + (done ? ' done' : '') + '" role="button" tabindex="0" data-log="' + m.id + '" aria-label="' + L[0] + '">' +
    (td > 0 ? '<button type="button" class="minus" data-unlog="' + m.id + '" aria-label="−1 ' + L[0] + '">−</button>' : '') +
    '<div class="row">' + avatar(m) + '<div style="min-width:0">' +
    '<div class="nm">' + L[0] + '</div>' +
    (L[1] ? '<div class="sub">' + L[1] + '</div>' : '') +
    '<div class="cnt' + (done ? ' ok' : '') + '">' + cnt + '</div>' +
    '</div></div>' + progress + '</div>';
}

function renderToday(){
  const day = state.days[todayKey()] || {};
  let h = '';
  h += '<div class="sec-head">' + t('bigHead') + '</div><div class="grid">' +
       MUSCLES.filter(m => m.grp === 'big').map(muscleCard).join('') + '</div>';
  h += '<div class="sec-head">' + t('smallHead') + '</div><div class="grid">' +
       MUSCLES.filter(m => m.grp === 'small').map(muscleCard).join('') + '</div>';
  h += '<div class="sec-head">' + t('extraHead') + '</div><div class="grid">' +
       MUSCLES.filter(m => m.grp === 'extra').map(muscleCard).join('') + '</div>';
  h += '<div class="panel"><h2>' + t('todaySummary') + '</h2>';
  if (dayHasWork(day)) {
    for (const m of MUSCLES) {
      const v = day[m.id] || 0;
      if (v > 0) {
        h += '<div class="sumline"><span>' + t('m')[m.id][0] + '</span><span class="v">' +
             (m.session ? '✓' : v + ' ' + t('sets')) + '</span></div>';
      }
    }
    h += '<div class="total"><span>' + t('totalSets') + '</span><span>' + dayTotalSets(day) + '</span></div>';
  } else {
    h += '<div class="muted">' + t('nothingToday') + '</div>';
  }
  h += '</div>';
  return h;
}

function renderWeek(){
  const keys = weekKeys();
  const range = fmt(parseKey(keys[0]), {day:'numeric', month:'long'}) + ' – ' +
                fmt(parseKey(keys[6]), {day:'numeric', month:'long'});
  const trained = daysTrainedThisWeek();
  let h = '<div class="panel" style="margin-top:16px"><h2>' + t('weekTitle') + '</h2>' +
    '<div class="muted">' + range + '</div>' +
    '<div class="wkstat" style="margin-top:10px"><span style="font-size:13.5px">' +
    t('trainedPrefix') + ' ' + trained + ' ' + t('trainedOf') + '</span>' +
    '<span class="wdots">' + Array.from({length:5}, (_,i) =>
      '<span class="wdot' + (i < trained ? ' on' : '') + '"></span>').join('') + '</span></div>' +
    '<div class="muted" style="margin-top:8px">' + t('totalSets') + ': ' +
    MUSCLES.reduce((s,m) => s + (m.session ? 0 : weekTotal(m.id)), 0) + '</div></div>';
  h += '<div class="panel">';
  for (const m of MUSCLES) {
    const L = t('m')[m.id];
    const wk = weekTotal(m.id);
    const done = wk >= m.target;
    const pct = Math.min(100, Math.round(wk / m.target * 100));
    h += '<div class="wrow g-' + m.grp + '">' + avatar(m) +
      '<div class="info"><div class="nm">' + L[0] + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
      '<span class="cnt' + (done ? ' ok' : '') + '">' + wk + '/' + m.target + (done ? ' ✓' : '') + '</span></div>';
  }
  h += '</div>';
  return h;
}

function renderExr(){
  let h = '<div class="panel" style="margin-top:16px"><h2>' + t('exrTitle') + '</h2><div class="muted">' + t('exrSub') + '</div></div>';
  for (const m of MUSCLES) {
    const L = t('m')[m.id];
    const builtin = EXR[m.id] || [];
    const custom = (state.custom && state.custom[m.id]) || [];
    h += '<details class="month exm" data-m="' + m.id + '"' + (ui.openExr.has(m.id) ? ' open' : '') + '>' +
      '<summary>' + avatar(m) + '<span class="exnm">' + L[0] + '</span><span class="n">' + (builtin.length + custom.length) + ' ' + t('exrWord') + '</span></summary>';
    for (const e of builtin) {
      h += '<div class="exrow" data-logx="' + m.id + '">' + mpic(e[5]) + '<div style="flex:1;min-width:0"><div>' + (state.lang === 'ar' ? e[0] : e[1]) + '</div>' +
        '<div class="exsub">' + (state.lang === 'ar' ? e[3] : e[4]) + '</div></div><span class="chip">' + t('eq')[e[2]] + '</span></div>';
    }
    for (const e of custom) {
      h += '<div class="exrow" data-logx="' + m.id + '">' + mpic(QICON[e.q]) + '<div style="flex:1;min-width:0"><div>' + esc(e.n) + '</div>' +
        (e.mch ? '<div class="exsub">' + esc(e.mch) + '</div>' : '') + '</div><span class="chip">' + t('eq')[e.q] + '</span></div>';
    }
    if (ui.addingFor === m.id) {
      h += '<div class="exform"><input id="exName" placeholder="' + t('exNamePh') + '" maxlength="40">' +
        '<input id="exMach" placeholder="' + t('exMachPh') + '" maxlength="60">' +
        '<select id="exEq">' + ['machine','bar','db','cable','body'].map(q =>
          '<option value="' + q + '">' + t('eq')[q] + '</option>').join('') + '</select>' +
        '<button type="button" data-saveex="' + m.id + '">' + t('saveBtn') + '</button></div>';
    } else {
      h += '<div class="exadd" data-add="' + m.id + '">' + t('addExr') + '</div>';
    }
    h += '</details>';
  }
  return h;
}

function renderHistory(){
  const keys = Object.keys(state.days).filter(k => dayHasWork(state.days[k])).sort().reverse();
  let h = '';
  if (!keys.length) {
    h += '<div class="panel"><div class="muted">' + t('emptyHistory') + '</div></div>';
  } else {
    if (ui.open === null) ui.open = new Set([keys[0].slice(0,7)]);
    const months = {};
    for (const k of keys) (months[k.slice(0,7)] = months[k.slice(0,7)] || []).push(k);
    for (const mk of Object.keys(months).sort().reverse()) {
      const label = fmt(parseKey(mk + '-01'), {month:'long', year:'numeric'});
      const dayKeys = months[mk];
      h += '<details class="month" data-month="' + mk + '"' + (ui.open.has(mk) ? ' open' : '') + '>' +
        '<summary><span>' + label + '</span><span class="n">' + dayKeys.length + ' ' + t('dayWord') + '</span></summary>';
      for (const dk of dayKeys) {
        const dTot = dayTotalSets(state.days[dk]);
        h += '<div class="dayrow"><div style="min-width:0"><div class="d">' + fmt(parseKey(dk), {weekday:'long', day:'numeric'}) + '</div>' +
             '<div class="s">' + daySummaryText(state.days[dk]) + '</div></div>' +
             (dTot > 0 ? '<span class="dtot">' + dTot + ' ' + t('sets') + '</span>' : '') + '</div>';
      }
      h += '</details>';
    }
  }
  const le = state.lastExport
    ? t('lastExportPrefix') + ' ' + fmt(parseKey(state.lastExport), {day:'numeric', month:'long', year:'numeric'})
    : t('lastExportNever');
  h += '<div class="panel"><h2>' + t('backup') + '</h2><div class="muted">' + le + '</div>' +
    '<div class="btns"><button type="button" data-act="export">' + t('exportBtn') + '</button>' +
    '<button type="button" data-act="import">' + t('importBtn') + '</button></div></div>';
  return h;
}

function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = t('dir');
  applyTheme();
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hDate').textContent = fmt(new Date(), {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('hWeek').textContent = t('trainedPrefix') + ' ' + daysTrainedThisWeek() + ' ' + t('trainedOf');
  document.getElementById('restX').setAttribute('aria-label', t('restStop'));
  document.getElementById('langBtn').textContent = t('langBtn');
  document.querySelector('#tabToday span').textContent = t('tabToday');
  document.querySelector('#tabWeek span').textContent = t('tabWeek');
  document.querySelector('#tabExr span').textContent = t('tabExr');
  document.querySelector('#tabHistory span').textContent = t('tabHistory');
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === ui.tab));
  const view = document.getElementById('view');
  view.innerHTML = ui.tab === 'today' ? renderToday() : ui.tab === 'week' ? renderWeek() :
    ui.tab === 'exr' ? renderExr() : renderHistory();
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function doExport(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sharar-gym-backup-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  state.lastExport = todayKey();
  save();
  render();
}

function mergeImport(inc){
  if (!inc || typeof inc.days !== 'object' || !inc.days) throw new Error('bad');
  for (const dk in inc.days) {
    const src = inc.days[dk];
    if (!src || typeof src !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(dk)) continue;
    const dst = state.days[dk] = state.days[dk] || {};
    for (const m of MUSCLES) {
      const v = Math.max(0, Math.floor(Number(src[m.id]) || 0));
      if (v > (dst[m.id] || 0)) dst[m.id] = v;
    }
  }
  if (inc.custom && typeof inc.custom === 'object') {
    if (!state.custom) state.custom = {};
    for (const mid in inc.custom) {
      if (!MUSCLES.some(m => m.id === mid) || !Array.isArray(inc.custom[mid])) continue;
      const dst = state.custom[mid] = state.custom[mid] || [];
      for (const e of inc.custom[mid]) {
        if (e && typeof e.n === 'string' && e.n.trim() && !dst.some(x => x.n === e.n)) {
          const entry = { n: e.n.slice(0, 40), q: (typeof e.q === 'string' && t('eq')[e.q]) ? e.q : 'machine' };
          if (typeof e.mch === 'string' && e.mch.trim()) entry.mch = e.mch.slice(0, 60);
          dst.push(entry);
        }
      }
    }
  }
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      mergeImport(JSON.parse(r.result));
      save();
      render();
      toast(t('importedOk'));
    } catch(e) {
      toast(t('importBad'));
    }
  };
  r.readAsText(file);
}

document.getElementById('view').addEventListener('click', e => {
  const un = e.target.closest('[data-unlog]');
  if (un) { unlogSet(un.dataset.unlog); return; }
  const lg = e.target.closest('[data-log]');
  if (lg) { logSet(lg.dataset.log); return; }
  const lx = e.target.closest('[data-logx]');
  if (lx) {
    const id = lx.dataset.logx;
    const before = (state.days[todayKey()] || {})[id] || 0;
    logSet(id);
    const after = (state.days[todayKey()] || {})[id] || 0;
    const m = MUSCLES.find(x => x.id === id);
    if (after > before && weekTotal(id) !== m.target) toast(t('m')[id][0] + ' +1 ✓');
    return;
  }
  const ad = e.target.closest('[data-add]');
  if (ad) {
    ui.addingFor = ad.dataset.add;
    render();
    const inp = document.getElementById('exName');
    if (inp) inp.focus();
    return;
  }
  const sv = e.target.closest('[data-saveex]');
  if (sv) {
    const name = (document.getElementById('exName').value || '').trim();
    const mch = (document.getElementById('exMach').value || '').trim();
    const q = document.getElementById('exEq').value;
    if (name) {
      if (!state.custom) state.custom = {};
      const entry = { n: name.slice(0, 40), q: q };
      if (mch) entry.mch = mch.slice(0, 60);
      (state.custom[sv.dataset.saveex] = state.custom[sv.dataset.saveex] || []).push(entry);
      ui.addingFor = null;
      save();
      render();
    }
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'export') doExport();
    else document.getElementById('importFile').click();
  }
});
document.getElementById('view').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.log) {
    e.preventDefault();
    logSet(e.target.dataset.log);
  }
});
document.getElementById('view').addEventListener('toggle', e => {
  const d = e.target;
  if (!d.classList || !d.classList.contains('month')) return;
  if (d.dataset.m) {
    if (d.open) ui.openExr.add(d.dataset.m); else ui.openExr.delete(d.dataset.m);
    return;
  }
  if (ui.open) {
    if (d.open) ui.open.add(d.dataset.month); else ui.open.delete(d.dataset.month);
  }
}, true);
document.getElementById('importFile').addEventListener('change', e => {
  if (e.target.files[0]) doImport(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  save();
  render();
});
document.getElementById('restX').addEventListener('click', stopRest);
document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
  save();
  render();
});
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.theme === 'auto') render();
  });
} catch(e) {}
document.querySelectorAll('nav button').forEach(b =>
  b.addEventListener('click', () => { ui.tab = b.dataset.tab; render(); }));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
});

render();
</script>
</body>
</html>
